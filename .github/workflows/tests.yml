name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'tools/**'
      - 'composer.json'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'tools/**'
      - 'composer.json'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - '.github/workflows/tests.yml'

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }} with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, gd, zip, mbstring, bcmath, redis, imagick, xml, curl, sqlite, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        if: matrix.php == '8.4'
        run: composer audit

      - name: PHPStan static analysis
        if: matrix.php == '8.4'
        run: php -d memory_limit=2G ./vendor/bin/phpstan analyse --no-progress

      - name: Run Unit tests with coverage
        run: ./vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage.xml --coverage-text

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.php }}
          path: coverage.xml

      - name: Coverage summary
        if: success()
        run: |
          echo "### Coverage (PHP ${{ matrix.php }})" >> "$GITHUB_STEP_SUMMARY"
          php -r '
            $xml = new SimpleXMLElement(file_get_contents("coverage.xml"));
            $metrics = $xml->project->metrics;
            $total = (int)$metrics["statements"];
            $covered = (int)$metrics["coveredstatements"];
            $pct = $total > 0 ? round($covered / $total * 100, 2) : 0;
            echo "- Lines covered: {$covered}/{$total} ({$pct}%)\n";
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage threshold check (PHP 8.4 only)
        if: matrix.php == '8.4'
        run: php tools/check-coverage-threshold.php coverage.xml

      # Application suites (Feature + Integration): these run the ported
      # PolisOS HTTP tests against the dummy consumer app under
      # tests/Application, booting the full Polis provider stack. They use a
      # separate phpunit config (phpunit-app.xml) + bootstrap
      # (tests/bootstrap-app.php) so the fixture-stub aliases used by the Unit
      # suite never collide with the real App\ classes.
      #
      # These are HARD gates: they must pass. The Feature/Integration suites in
      # phpunit-app.xml run the ENTIRE tests/Feature and tests/Integration
      # directories (no enumerated allow-list) — every ported PolisOS test runs
      # here and must be green.
      - name: Run Feature tests (dummy consumer app)
        run: php -d memory_limit=1G ./vendor/bin/phpunit -c phpunit-app.xml --testsuite=Feature

      - name: Run Integration tests (dummy consumer app)
        run: php -d memory_limit=1G ./vendor/bin/phpunit -c phpunit-app.xml --testsuite=Integration
