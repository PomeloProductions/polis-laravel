name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'tools/**'
      - 'composer.json'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'tools/**'
      - 'composer.json'
      - 'phpunit.xml'
      - 'phpstan.neon'
      - '.github/workflows/tests.yml'

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }} with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, gd, zip, mbstring, bcmath, redis, imagick, xml, curl, sqlite, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer audit
        if: matrix.php == '8.4'
        run: composer audit

      - name: PHPStan static analysis
        if: matrix.php == '8.4'
        run: php -d memory_limit=2G ./vendor/bin/phpstan analyse --no-progress

      - name: Run Unit tests with coverage
        run: php -d memory_limit=1G ./vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage-unit.xml --coverage-text

      - name: Coverage summary
        if: success()
        run: |
          echo "### Unit coverage (PHP ${{ matrix.php }})" >> "$GITHUB_STEP_SUMMARY"
          php -r '
            $xml = new SimpleXMLElement(file_get_contents("coverage-unit.xml"));
            $metrics = $xml->project->metrics;
            $total = (int)$metrics["statements"];
            $covered = (int)$metrics["coveredstatements"];
            $pct = $total > 0 ? round($covered / $total * 100, 2) : 0;
            echo "- Lines covered: {$covered}/{$total} ({$pct}%)\n";
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Unit coverage threshold check (PHP 8.4 only)
        if: matrix.php == '8.4'
        run: php tools/check-coverage-threshold.php coverage-unit.xml

      # Application suites (Feature + Integration): these run the ported
      # PolisOS HTTP tests against the dummy consumer app under
      # tests/Application, booting the full Polis provider stack. They use a
      # separate phpunit config (phpunit-app.xml) + bootstrap
      # (tests/bootstrap-app.php) so the fixture-stub aliases used by the Unit
      # suite never collide with the real App\ classes.
      #
      # These are HARD gates: they must pass. The Feature/Integration suites in
      # phpunit-app.xml run the ENTIRE tests/Feature and tests/Integration
      # directories (no enumerated allow-list) — every ported PolisOS test runs
      # here and must be green. They also emit clover so the combined-coverage
      # gate below can guard Feature/Integration coverage against regression.
      - name: Run Feature tests (dummy consumer app)
        run: php -d memory_limit=1G ./vendor/bin/phpunit -c phpunit-app.xml --testsuite=Feature --coverage-clover=coverage-feature.xml

      - name: Run Integration tests (dummy consumer app)
        run: php -d memory_limit=1G ./vendor/bin/phpunit -c phpunit-app.xml --testsuite=Integration --coverage-clover=coverage-integration.xml

      # Combined-coverage gate: union of covered lines across ALL THREE suites.
      # This is the honest "how much of ./src does the whole corpus touch"
      # figure (~65%). The floor keeps Feature/Integration coverage from
      # silently regressing — the Unit-only gate above can't see it.
      - name: Combined coverage gate (PHP 8.4 only)
        if: matrix.php == '8.4'
        run: |
          php tools/merge-coverage.php \
            --json coverage-combined.json \
            --min 64.0 \
            coverage-unit.xml coverage-feature.xml coverage-integration.xml
          echo "### Combined coverage (PHP ${{ matrix.php }})" >> "$GITHUB_STEP_SUMMARY"
          php -r '
            $j = json_decode(file_get_contents("coverage-combined.json"), true);
            printf("- Union lines covered: %d/%d (%.2f%%)\n", $j["covered"], $j["total"], $j["percent"]);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.php }}
          path: |
            coverage-unit.xml
            coverage-feature.xml
            coverage-integration.xml
            coverage-combined.json
          if-no-files-found: ignore
