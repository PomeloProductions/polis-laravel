name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest-driven configuration; release-please reads both files.
          token: ${{ secrets.GITHUB_TOKEN }}

      # When release-please actually cuts a release (tag + GitHub release),
      # ping the Packagist "Force Update" API so the new tag publishes
      # immediately instead of waiting for Packagist's periodic crawl.
      #
      # Gated on release-please's `releases_created` output (manifest mode),
      # so it never fires on ordinary pushes or on release-PR updates.
      #
      # Secrets PACKAGIST_USERNAME / PACKAGIST_TOKEN are NOT yet configured;
      # the step is additionally guarded on PACKAGIST_TOKEN being non-empty
      # (mapped to an env var, since secrets are not available in step-level
      # `if:` expressions) so it no-ops cleanly until the owner adds them.
      - name: Notify Packagist of new release
        if: ${{ steps.release.outputs.releases_created == 'true' && env.PACKAGIST_TOKEN != '' }}
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sS -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/PomeloProductions/polis-laravel"}}'
